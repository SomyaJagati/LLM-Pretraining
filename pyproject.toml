[project]
name = "llmfromscratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SomyaJagati", email = "somyajagati@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.0",
    "matplotlib>=3.7.1",
    "numpy>=1.26",
    "pandas>=2.2.1",
    "psutil>=5.9.5",
    "streamlit>=1.67.0",
    "tiktoken>=0.5.1",
    "torch>=2.2.2",
    "tqdm>=4.66.1",
]

[project.scripts]
llmfromscratch = "llmfromscratch:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
